image_finetune: false

output_dir: "outputs"
pretrained_model_path: "/workspace/AD-Evo-Tuner/models/StableDiffusion"
unet_checkpoint_path: "/workspace/AD-Evo-Tuner/models/StableDiffusion/unet/diffusion_pytorch_model.safetensors"
vae_checkpoint_path: "/workspace/AD-Evo-Tuner/models/StableDiffusion/vae/diffusion_pytorch_model.safetensors"
vanilla_motion_checkpoint_path: "/workspace/AnimateDiff/PaintFlow/outputs/enhance_stage_64_strength_2/checkpoints/checkpoint.ckpt"
unet_additional_kwargs:
  use_motion_module              : true
  motion_module_resolutions      : [ 1,2,4,8 ]
  unet_use_cross_frame_attention : false
  unet_use_temporal_attention    : false

  motion_module_type: PaintingEnhancedVanilla
  motion_module_kwargs:
    num_attention_heads                : 6
    num_transformer_block              : 1
    attention_block_types              : [ "Temporal_Self", "Temporal_Self" ]
    temporal_position_encoding         : true
    temporal_position_encoding_max_len : 48
    temporal_attention_dim_div         : 1
    zero_initialize                    : true
    enable_painting_enhancement: true
    painting_stage_dim: 128
    progressive_strength: 0.5
    enable_progressive_attention: true


noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "linear"
  steps_offset:        1
  clip_sample:         false

train_data:
  csv_path:        "/workspace/CoPaint_datasets/PaintDynamic/annotations/annotation_ctrl.csv"
  video_folder:    "/workspace/CoPaint_datasets/PaintDynamic/videos"
  video_json_path: "/workspace/CoPaint_datasets/PaintDynamic/annotations/t2v_clips.jsonl"
  split_file:      "/workspace/CoPaint_datasets/PaintDynamic/annotations/splits/train.txt"
  sample_size:     256
  sample_stride:   1
  sample_n_frames: 16
  enhance_early_stages: true
  early_stage_frames: 4
  line_extraction_method: "connected_canny"  # 最平衡
  line_connection: true
  noise_reduction: true


validation_data:
  prompts:
   - "Painting process: sketch → line art → base colors → shading. a vibrant and celebratory birthday card featuring Hatsune Miku, a beloved anime character."
   - "Painting process: sketch → line art → base colors → shading. a serene scene of a woman standing in front of a window, surrounded by butterflies and lush greenery."
   - "Painting process: sketch → line art → base colors → shading. a girl standing in the center of a large, bloodshot eye, surrounded by dark eyelashes and a white iris."
   - "Painting process: sketch → line art → base colors → shading. a digital illustration of an anime-style baseball players"
   - "Painting process: sketch → line art → base colors → shading. two men sharing a moment of intimacy, with one of them holding a lit cigarette to the other's mouth."

  num_inference_steps: 50
  guidance_scale: 8.

trainable_modules:
  - "motion_modules."


learning_rate:    2.e-6
train_batch_size: 3

max_train_epoch:      -1
max_train_steps:      40000
checkpointing_epochs: -1
checkpointing_steps:  200

validation_steps:       500
validation_steps_tuple: [50, 100]

global_seed: 42
mixed_precision_training: true
enable_xformers_memory_efficient_attention: True

is_debug: False
