
image_finetune: false

output_dir: "/workspace/AnimateDiff/PaintFlow/outputs/sparsectrl_sketch"
pretrained_model_path: "/workspace/AD-Evo-Tuner/models/StableDiffusion"
controlnet_checkpoint_path: "models/SparseCtrl/v3_sd15_sparsectrl_scribble.ckpt"
motion_module_path: "paintflow.ckpt"


# SparseCtrl 特定配置
sparse_ctrl_config:
  enable_random_masking: true  # 是否启用随机掩码
  min_condition_frames: 1      # 最少条件帧数
  max_condition_frames: 16     # 最多条件帧数（-1表示使用全部帧数）
  mask_probability: 1.0        # 应用掩码的概率

unet_additional_kwargs:
  use_motion_module: true
  motion_module_resolutions: [1,2,4,8]
  unet_use_cross_frame_attention: false
  unet_use_temporal_attention: false
  motion_module_type: PaintingEnhancedVanilla
  motion_module_kwargs:
    num_attention_heads: 6
    num_transformer_block: 1
    attention_block_types: [ "Temporal_Self", "Temporal_Self" ]
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 48
    temporal_attention_dim_div: 1
    zero_initialize: true
    enable_painting_enhancement: true  # 新增参数
    painting_stage_dim: 128   # 新增参数
    progressive_strength: 0.5 # 新增参数
    enable_progressive_attention: true # 新增参数


controlnet_additional_kwargs:
  set_noisy_sample_input_to_zero: true
  use_simplified_condition_embedding: true
  conditioning_channels: 4
  use_motion_module: true
  motion_module_resolutions: [1,2,4,8]
  motion_module_mid_block: false
  motion_module_type: "PaintingEnhancedVanilla"
  motion_module_kwargs:
    num_attention_heads: 6
    num_transformer_block: 1
    attention_block_types: [ "Temporal_Self", "Temporal_Self" ]
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 48
    temporal_attention_dim_div: 1
    zero_initialize: true
    enable_painting_enhancement: true  # 新增参数
    painting_stage_dim: 128   # 新增参数
    progressive_strength: 0.5 # 新增参数
    enable_progressive_attention: true # 新增参数

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "linear"
  steps_offset: 1
  clip_sample: false

train_data:
  csv_path: "/workspace/CoPaint_datasets/PaintDynamic/annotations/annotation_ctrl.csv"
  video_folder: "/workspace/CoPaint_datasets/PaintDynamic/videos"
  video_json_path: "/workspace/CoPaint_datasets/PaintDynamic/annotations/sketchctrl_clips.jsonl"
  split_file: "/workspace/CoPaint_datasets/PaintDynamic/annotations/splits/train.txt"
  sample_size: 256

validation_data:
  prompts:
   - "Painting process: sketch → line art → base colors → shading"
  num_inference_steps: 50
  guidance_scale: 8.

learning_rate: 1.e-5
train_batch_size: 1
max_train_steps: 30000
checkpointing_steps: 500
validation_steps: 500

global_seed: 42
mixed_precision_training: true
enable_xformers_memory_efficient_attention: true
